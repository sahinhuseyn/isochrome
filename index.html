<style>

  .crow .pbar { grid-column: 2 / 4; }
  .srow { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; }
  .srow .sn { flex: 1; font-weight: 600; } .srow button { color: var(--mute); font-size: 18px; padding: 4px 8px; }
  .btn2 { background: var(--ink); color: var(--cream); font-family: var(--hf); font-weight: 700; font-size: 19px; text-transform: uppercase; padding: 11px 16px; border-radius: 14px; width: 100%; margin-top: 4px; }
  .reset { display: block; margin: 26px auto 0; color: var(--mute); font-size: 12px; text-decoration: underline; }
</style>

<body>
<div id="map"></div>
<button id="hud" aria-label="Profil və irəliləyiş">

  <span class="st" id="hSt">🔥 0</span>

<div id="sheet">
  <div id="grab"></div>
  <div id="home">
    <div class="row" id="times">
      <button class="pill on" data-min="5">🚶 5 dəq</button>
      <button class="pill" data-min="10">🚶 10 dəq</button>
      <button class="pill" data-min="15">🚶 15 dəq</button>
    </div>
    <button id="surprise">✨ Məni təəccübləndir</button>
    <div id="pick" hidden></div>
    <div class="row" id="saved" hidden style="margin-top:10px"></div>
    <div class="row" id="cats"></div>

    <div id="info"></div>
  </div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// CORE START
const WALK_MS = 1.34; // metres per second, about 4.8 km/h

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function buildGraph(elements) {
  const index = new Map(), lat = [], lon = [], adj = [];
  const nodeId = (p) => {
    const key = p.lat.toFixed(7) + "," + p.lon.toFixed(7);
    let i = index.get(key);
    if (i === undefined) {
      i = lat.length; index.set(key, i);
      lat.push(p.lat); lon.push(p.lon); adj.push([]);
    }
    return i;
  };
  for (const el of elements) {
    if (el.type !== "way" || !el.geometry) continue;
    let prev = null;
    for (const p of el.geometry) {
      const cur = nodeId(p);
      if (prev !== null && prev !== cur) {
        const w = haversine(lat[prev], lon[prev], lat[cur], lon[cur]);
        adj[prev].push([cur, w]);
        adj[cur].push([prev, w]);
      }
      prev = cur;
    }
  }
  return { lat, lon, adj };
}

// Graph from the compact baku.json written by prepare_baku.py: {lat[], lon[], edges[a,b,a,b,...]}
function graphFromData(d) {
  const adj = Array.from({ length: d.lat.length }, () => []);
  for (let i = 0; i < d.edges.length; i += 2) {
    const a = d.edges[i], b = d.edges[i + 1];
    const w = haversine(d.lat[a], d.lon[a], d.lat[b], d.lon[b]);
    adj[a].push([b, w]);
    adj[b].push([a, w]);
  }
  return { lat: d.lat, lon: d.lon, adj };
}

function nearestNode(g, la, lo) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < g.lat.length; i++) {
    const d = haversine(la, lo, g.lat[i], g.lon[i]);
    if (d < bd) { bd = d; best = i; }
  }
  return { node: best, dist: bd };
}

function dijkstra(g, src, limit) {
  const dist = new Float64Array(g.lat.length).fill(Infinity);
  const prev = new Int32Array(g.lat.length).fill(-1);
  dist.prev = prev; // lets pathTo() rebuild the route to any reached node
  dist[src] = 0;
  const heap = [[0, src]];
  const push = (x) => {
    heap.push(x);
    let i = heap.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (heap[p][0] <= heap[i][0]) break;
      [heap[p], heap[i]] = [heap[i], heap[p]]; i = p;
    }
  };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      let i = 0;
      for (;;) {
        let l = 2 * i + 1, r = l + 1, m = i;
        if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
        if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
        if (m === i) break;
        [heap[m], heap[i]] = [heap[i], heap[m]]; i = m;
      }
    }
    return top;
  };
  while (heap.length) {
    const [d, u] = pop();
    if (d > dist[u]) continue;
    if (d > limit) break;
    for (const [v, w] of g.adj[u]) {
      const nd = d + w;
      if (nd < dist[v] && nd <= limit) { dist[v] = nd; prev[v] = u; push([nd, v]); }
    }
  }
  return dist;
}

// Route from the Dijkstra source to `node` as [[lat,lon],...]; null if the node was not reached.
function pathTo(g, dist, node) {
  if (!(dist[node] < Infinity)) return null;
  const pts = [];
  for (let v = node; v !== -1; v = dist.prev[v]) pts.push([g.lat[v], g.lon[v]]);
  return pts.reverse();
}

// Returns line segments [[lat,lon],[lat,lon]] clipped at `limit` metres, and their total length.
function reachableSegments(g, dist, limit) {
  const segs = [];
  let total = 0;
  for (let a = 0; a < g.adj.length; a++) {
    for (const [b, w] of g.adj[a]) {
      if (a > b) continue;
      const da = dist[a], db = dist[b];
      const A = [g.lat[a], g.lon[a]], B = [g.lat[b], g.lon[b]];
      if (da <= limit && db <= limit) {
        segs.push([A, B]); total += w;
      } else if (da <= limit || db <= limit) {
        const [P, Q, dp] = da <= limit ? [A, B, da] : [B, A, db];
        const f = Math.min(1, Math.max(0, (limit - dp) / w));
        if (f > 0) {
          segs.push([P, [P[0] + (Q[0] - P[0]) * f, P[1] + (Q[1] - P[1]) * f]]);
          total += w * f;
        }
      }
    }
  }
  return { segs, total };
}

// ---------- POI ranking ----------
const CAT_LABELS = {
  kafe: "Kafe", yemek: "Yemək", gozellik: "Gözəllik",
  park: "Park", metro: "Metro", gorulecek: "Görməli",
};

function catOf(t) {
  if (t.railway === "station" && (t.station === "subway" || t.subway === "yes")) return "metro";
  if (t.public_transport === "station" && t.subway === "yes") return "metro";
  if (t.leisure === "park" || t.leisure === "garden") return "park";
  if (t.amenity === "cafe") return "kafe";
  if (["restaurant", "fast_food", "food_court"].includes(t.amenity)) return "yemek";
  if (["beauty", "hairdresser", "cosmetics"].includes(t.shop)) return "gozellik";
  if (["attraction", "museum", "gallery", "viewpoint"].includes(t.tourism) || t.historic) return "gorulecek";
  return null;
}

// Rough "is this place well-known / well-maintained" proxy: OSM has no ratings.
function notability(t) {
  let n = 0;
  if (t.wikidata || t.wikipedia) n += 3;
  if (t.tourism || t.historic) n += 2;
  if (t.website || t["contact:website"]) n += 1;
  if (t.opening_hours) n += 1;
  if (t.brand) n += 0.5;
  if (t.phone || t["contact:phone"]) n += 0.5;
  if (t.instagram || t["contact:instagram"]) n += 0.5;
  return n;
}

const scoreOf = (n, tMin) => (1 + n) / (1 + tMin / 5);

// Snap POIs to the walking graph, keep those reachable within `limit` metres, rank by score.
function rankPois(elements, g, dist, limit, maxSnap = 200) {
  const out = [];
  const keptByKey = new Map();
  // Only nodes the walker can actually reach are candidates, so a big city graph stays fast.
  const reached = [];
  for (let i = 0; i < dist.length; i++) if (dist[i] <= limit) reached.push(i);
  for (const el of elements) {
    const t = el.tags || {};
    const name = t["name:az"] || t.name || t["name:en"];
    const cat = catOf(t);
    if (!name || !cat) continue;
    const p = el.type === "node" ? { lat: el.lat, lon: el.lon } : el.center;
    if (!p) continue;
    const cosLat = Math.cos(p.lat * Math.PI / 180);
    let best = -1, bd = Infinity;
    for (const i of reached) {
      const dy = (g.lat[i] - p.lat) * 110574, dx = (g.lon[i] - p.lon) * 111320 * cosLat;
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0) continue;
    const snap = Math.sqrt(bd);
    if (snap > maxSnap) continue;
    const total = dist[best] + snap;
    if (!(total <= limit)) continue;
    const tMin = total / WALK_MS / 60;
    const n = notability(t);
    const item = { name, cat, lat: p.lat, lon: p.lon, tMin, n, score: scoreOf(n, tMin), node: best, snap };
    const key = cat + "|" + name.toLowerCase();
    const same = keptByKey.get(key) || [];
    const dup = same.find((o) => haversine(o.lat, o.lon, item.lat, item.lon) < 60);
    if (dup) {
      if (item.tMin < dup.tMin) Object.assign(dup, item);
      continue;
    }
    same.push(item); keptByKey.set(key, same); out.push(item);
  }
  return out.sort((a, b) => b.score - a.score);
}
// ---------- personal taste ----------
const placeKey = (p) => `${p.cat}|${p.name.toLowerCase()}|${p.lat.toFixed(4)},${p.lon.toFixed(4)}`;

// prefs = { like: { placeKey: 1 | -1 } }. A liked place gets x2, a disliked one x0.3; every like/dislike in a
// category also nudges that whole category (+/-15% per net vote, clamped to 0.5..2). Returns a new sorted list.
function applyPrefs(list, prefs) {
  const like = (prefs && prefs.like) || {};
  const net = {};
  for (const p of list) { const v = like[placeKey(p)]; if (v) net[p.cat] = (net[p.cat] || 0) + v; }
  return list
    .map((p) => {
      const v = like[placeKey(p)] || 0;
      const catW = Math.min(2, Math.max(0.5, 1 + 0.15 * (net[p.cat] || 0)));
      return { ...p, score: p.score * (v > 0 ? 2 : v < 0 ? 0.3 : 1) * catW };
    })
    .sort((a, b) => b.score - a.score);
}

// Count of reachable places per category, e.g. { kafe: 12, metro: 3 }.
function summarize(list) {
  const c = {};
  for (const p of list) c[p.cat] = (c[p.cat] || 0) + 1;
  return c;
}

// Keep at most `perCat` places from each category, preserving the (already score-sorted) order.
function diversify(list, perCat = 2) {
  const count = {};
  return list.filter((p) => (count[p.cat] = (count[p.cat] || 0) + 1) <= perCat);
}
// ---------- turn-by-turn ----------
function bearing(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, dl = (lo2 - lo1) * r;
  const y = Math.sin(dl) * Math.cos(la2 * r);
  const x = Math.cos(la1 * r) * Math.sin(la2 * r) - Math.sin(la1 * r) * Math.cos(la2 * r) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const angDiff = (a, b) => ((b - a + 540) % 360) - 180; // signed turn from heading a to heading b, + = right

// Steps from a polyline [[lat,lon],...]: [{ turn, dist }]. `turn` is how to enter that leg ("start" for the first;
// otherwise left/right, slight_left/slight_right, uturn); `dist` is its length in metres.
// Bends under 30 degrees and legs under 10 m are merged into the leg before them.
function routeSteps(pts) {
  const segs = [];
  for (let i = 1; i < pts.length; i++) {
    const d = haversine(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
    if (d >= 0.5) segs.push({ i0: i - 1, i1: i, d, b: bearing(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]) });
  }
  if (!segs.length) return [];
  const legs = [];
  for (const s of segs) {
    const last = legs[legs.length - 1];
    if (last && Math.abs(angDiff(last.lastB, s.b)) < 30 && Math.abs(angDiff(last.b0, s.b)) < 60) {
      last.i1 = s.i1; last.d += s.d; last.lastB = s.b;
    } else legs.push({ i0: s.i0, i1: s.i1, d: s.d, b0: s.b, lastB: s.b });
  }
  const legB = (l) => bearing(pts[l.i0][0], pts[l.i0][1], pts[l.i1][0], pts[l.i1][1]);
  for (let changed = true; changed;) {
    changed = false;
    for (let k = 1; k < legs.length; k++) {
      const l = legs[k], prev = legs[k - 1];
      const tiny = l.d < 10 && k < legs.length - 1;
      const straight = Math.abs(angDiff(legB(prev), legB(l))) < 30;
      if (tiny || straight) { prev.i1 = l.i1; prev.d += l.d; legs.splice(k, 1); changed = true; break; }
    }
  }
  return legs.map((l, k) => {
    let turn = "start";
    if (k > 0) {
      const a = angDiff(legB(legs[k - 1]), legB(l)), m = Math.abs(a);
      turn = m >= 150 ? "uturn" : (m < 60 ? "slight_" : "") + (a > 0 ? "right" : "left");
    }
    return { turn, dist: l.d };
  });
}

// ---------- game logic (pure; all state is passed in, nothing touches the DOM) ----------
const CAT_EMOJI = { kafe: "☕", yemek: "🍽️", gozellik: "💅", park: "🌳", metro: "🚇", gorulecek: "🏛️" };
const BASE_XP = { kafe: 15, yemek: 15, gozellik: 15, park: 20, metro: 10, gorulecek: 30 };
const QUEST_XP = 20;
const LEVEL_NAMES = ["Turist", "Gəzən", "Kəşfiyyatçı", "Bakılı", "Şəhər bələdçisi", "Yerli əfsanə"];

// New place: base + 2 XP per walking minute (farther = more reward) + 10 if GPS-verified. Repeat visit: 5.
function xpFor(p, alreadyVisited, verified) {
  if (alreadyVisited) return 5;
  return BASE_XP[p.cat] + 2 * Math.max(1, Math.round(p.tMin)) + (verified ? 10 : 0);
}

// Level n -> n+1 needs 50 + 50*n XP (100, 150, 200, ...).
function levelFor(xp) {
  let level = 1, floor = 0;
  for (;;) {
    const need = 50 + 50 * level;
    if (xp < floor + need) {
      return { level, name: LEVEL_NAMES[Math.min(level, LEVEL_NAMES.length) - 1], into: xp - floor, need, pct: (xp - floor) / need };
    }
    floor += need; level++;
  }
}

const pad2 = (n) => String(n).padStart(2, "0");
function dayStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function shiftDay(s, delta) {
  const [y, m, d] = s.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + delta));
  return `${t.getUTCFullYear()}-${pad2(t.getUTCMonth() + 1)}-${pad2(t.getUTCDate())}`;
}

// Consecutive days with a check-in, ending today (or yesterday, so the streak is still alive before today's first check-in).
function streakOf(days, today) {
  const set = new Set(days);
  let cur = set.has(today) ? today : shiftDay(today, -1);
  let n = 0;
  while (set.has(cur)) { n++; cur = shiftDay(cur, -1); }
  return n;
}

// Discoveries = first check-in at each distinct place. Repeats don't count towards badges/quests.
function statsOf(checkins, today) {
  const seen = new Set(), byCat = {};
  for (const c of checkins) {
    if (seen.has(c.key)) continue;
    seen.add(c.key);
    byCat[c.cat] = (byCat[c.cat] || 0) + 1;
  }
  return { total: seen.size, byCat, streak: streakOf(checkins.map((c) => c.day), today) };
}

const QUEST_POOL = [
  { id: "cafe1", emoji: "☕", text: "Yeni bir kafe kəşf et", cat: "kafe", n: 1 },
  { id: "park1", emoji: "🌳", text: "Yeni parkda gəz", cat: "park", n: 1 },

];

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Same 3 quests for everyone on a given day: two different category quests + one "any place" quest.
function questsFor(day) {
  let h = hashStr(day);
  const pool = QUEST_POOL.filter((q) => q.cat), picks = [];
  while (picks.length < 2) {
    picks.push(pool.splice(h % pool.length, 1)[0]);
    h = (Math.imul(h, 1103515245) + 12345) >>> 0;
  }
  const any = QUEST_POOL.filter((q) => !q.cat);
  picks.push(any[(h >>> 3) % any.length]);
  return picks;
}

// todays = today's discoveries (first visits) only.
function questProgress(q, todays) {
  return todays.filter((c) => !q.cat || c.cat === q.cat).length;
}

const emptyGame = () => ({ xp: 0, checkins: [], questsDone: {}, badges: [] });

// Records a check-in and returns the new game state plus everything the UI wants to celebrate.
function applyCheckin(state, p, verified, now = new Date()) {
  const day = dayStr(now), key = placeKey(p);
  const isNew = !state.checkins.some((c) => c.key === key);
  const gained = xpFor(p, !isNew, verified);
  const checkins = state.checkins.concat([{ key, cat: p.cat, name: p.name, lat: p.lat, lon: p.lon, day, ts: now.getTime(), xp: gained, v: !!verified, nw: isNew }]);

  const hadBadges = new Set(state.badges || []);
  const earnedNow = badgesEarned(statsOf(checkins, day));
  const newBadges = earnedNow.filter((id) => !hadBadges.has(id));

  const done = new Set((state.questsDone || {})[day] || []);
  const todays = checkins.filter((c) => c.day === day && c.nw);
  const newQuests = [];
  for (const q of questsFor(day)) {
    if (!done.has(q.id) && questProgress(q, todays) >= q.n) { newQuests.push(q); done.add(q.id); }
  }
  const bonus = newQuests.length * QUEST_XP;
  const xp = state.xp + gained + bonus;
  return {
    state: { xp, checkins, questsDone: { ...(state.questsDone || {}), [day]: [...done] }, badges: [...new Set([...hadBadges, ...earnedNow])] },
    gained, bonus, isNew, newBadges, newQuests,
    levelBefore: levelFor(state.xp).level, levelAfter: levelFor(xp).level,
  };
}

// "Surprise me": weighted random pick, unvisited places 4x more likely, better-scored places more likely.
function pickSurprise(list, visited, rng = Math.random) {
  if (!list.length) return null;
  const w = list.map((p) => (visited.has(placeKey(p)) ? 1 : 4) * Math.sqrt(Math.max(p.score, 0.01)));
  let r = rng() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}

// Named places per category in the whole dataset: the "collect them all" denominators.
function totalsFromPois(pois) {
  const c = {};
  for (const el of pois) {
    const t = el.tags || {};
    const cat = catOf(t);
    if (cat && (t.name || t["name:az"] || t["name:en"])) c[cat] = (c[cat] || 0) + 1;
  }
  return c;
}

const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
];

async function overpass(q) {
  let lastErr;
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return (await r.json()).elements;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function fetchWays(lat, lon, radius) {
  return overpass(`[out:json][timeout:25];
way["highway"]["highway"!~"motorway|motorway_link|trunk|trunk_link|construction|proposed|raceway|bus_guideway"]
["foot"!="no"]["access"!~"private|no"](around:${radius},${lat},${lon});
out geom;`);
}

function fetchPois(lat, lon, radius) {
  const a = `(around:${radius},${lat},${lon})`;
  return overpass(`[out:json][timeout:25];
(
  nwr["amenity"~"^(cafe|restaurant|fast_food|food_court)$"]${a};
  nwr["shop"~"^(beauty|hairdresser|cosmetics)$"]${a};
  nwr["leisure"~"^(park|garden)$"]${a};

  nwr["tourism"~"^(attraction|museum|gallery|viewpoint)$"]${a};

);
out center tags;`);
}

function refreshExplored() {
  const src = map.getSource("explored");
  if (!src) return;
  const seen = new Set(), features = [];
  for (const c of game.checkins) {
    if (seen.has(c.key) || typeof c.lat !== "number") continue;
    seen.add(c.key);
    features.push({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [c.lon, c.lat] } });
  }
  src.setData({ type: "FeatureCollection", features });
}

  const src = map.getSource("route");
  if (!src) return;
  src.setData(coords
    ? { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } }
    : emptyGeo);
}

  coords.forEach((c) => b.extend(c));

  }
  for (const p of list) {
    const key = placeKey(p), done = vis.has(key);
    const c = el("div", "card" + (key === selected ? " sel" : ""));
    c.dataset.key = key;
    c.append(el("div", "cic", CAT_EMOJI[p.cat]), el("div", "cn", p.name),
      el("div", "cm", `${Math.max(1, Math.round(p.tMin))} dəq · ${Math.round(p.tMin * 60 * WALK_MS)} m`),
      el("div", "cx" + (done ? " done" : ""), done ? "✓ getmisən" : `+${xpFor(p, false, false)} XP`));
    const liked = prefs.like[key] === 1;
    const h = el("span", "hrt" + (liked ? " on" : ""), "♥");
    h.setAttribute("role", "button");
    h.setAttribute("aria-label", "Bəyən");
    h.onclick = (ev) => {
      ev.stopPropagation();
      if (liked) delete prefs.like[key]; else prefs.like[key] = 1;
      store.set("reach.prefs", prefs);
      renderCards();
    };
    c.appendChild(h);
    c.onclick = () => selectPlace(p);
    box.appendChild(c);
    addPin(p);
  }
  box.scrollLeft = sl;
}

// ---------- selecting a place and the route to it ----------
function renderPick() {
  const box = $("pick");
  if (!selectedPlace) { box.hidden = true; return; }
  const p = selectedPlace, seen = visitedSet().has(placeKey(p));
  box.hidden = false;
  box.replaceChildren();
  const tx = el("div", "tx");
  tx.append(el("div", "pn", p.name),
    el("div", "pm", `${Math.max(1, Math.round(p.tMin))} dəq · ${Math.round(p.tMin * 60 * WALK_MS)} m · ` + (seen ? "artıq getmisən (+5 XP)" : `+${xpFor(p, false, false)} XP`)));
  const go = el("button", "go", "Gedirəm");
  go.onclick = () => startNav(p);
  const x = el("button", "x", "✕");
  x.setAttribute("aria-label", "Seçimi ləğv et");
  x.onclick = clearSelection;
  box.append(el("div", "pe2", CAT_EMOJI[p.cat]), tx, go, x);
}

function clearSelection() {
  selected = null; selectedPlace = null;
  setRoute(null);
  pinEls.forEach((o) => o.classList.remove("sel"));
  document.querySelectorAll("#cards .card.sel").forEach((c) => c.classList.remove("sel"));
  renderPick();
}

function selectPlace(p) {
  if (!ctx || navPlace) return;
  const path = pathTo(ctx.g, ctx.dist, p.node);
  if (!path) return;
  selectedPlace = p; selected = placeKey(p);
  const coords = [[start[1], start[0]], ...path.map(([la, lo]) => [lo, la]), [p.lon, p.lat]];
  setRoute(coords);
  addPin(p); // the "surprise" pick may not be among the visible cards
  pinEls.forEach((o, k) => o.classList.toggle("sel", k === selected));
  document.querySelectorAll("#cards .card").forEach((c) => {
    const on = c.dataset.key === selected;
    c.classList.toggle("sel", on);
    if (on) c.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  });
  renderPick();
  fitTo(coords, 18);
}

// ---------- navigation mode and check-in ----------
function updateMe() {
  if (!gps) return;
  if (!meMarker) meMarker = new maplibregl.Marker({ element: el("div", "gdot") }).setLngLat([gps.lon, gps.lat]).addTo(map);
  else meMarker.setLngLat([gps.lon, gps.lat]);
}

function renderNav() {
  const p = navPlace, nav = $("nav");
  nav.replaceChildren();
  const left = gps ? Math.round(haversine(gps.lat, gps.lon, p.lat, p.lon)) : Math.round(p.tMin * 60 * WALK_MS);
  nav.append(el("div", "nv-ic", CAT_EMOJI[p.cat]), el("div", "nv-nm", p.name), el("div", "nv-big", left + " m"),
    el("div", "nv-sub", gps ? "qalıb · canlı GPS ilə" : `~${Math.max(1, Math.round(left / WALK_MS / 60))} dəq · narıncı yolu izlə`));
  const btns = el("div", "btns");
  const ok = el("button", "ok", "✓ Çatdım");
  ok.onclick = () => doCheckIn(p, !!(gps && haversine(gps.lat, gps.lon, p.lat, p.lon) < 80));
  const cancel = el("button", "cancel", "Ləğv et");
  cancel.onclick = endNav;
  btns.append(ok, cancel);
  nav.appendChild(btns);
}

function onGps(pos) {
  gps = { lat: pos.coords.latitude, lon: pos.coords.longitude };
  updateMe();
  if (navPlace) {
    if (haversine(gps.lat, gps.lon, navPlace.lat, navPlace.lon) < 40) doCheckIn(navPlace, true);
    else renderNav();
  }
}

function startNav(p) {
  navPlace = p;
  $("home").hidden = true;
  $("nav").hidden = false;
  renderNav();
  if (navigator.geolocation && watchId === null) {
    watchId = navigator.geolocation.watchPosition(onGps, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
  }
}

function endNav() {
  navPlace = null;
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  $("nav").hidden = true;
  $("home").hidden = false;
  fitTo(selectedPlace ? [[start[1], start[0]], [selectedPlace.lon, selectedPlace.lat]] : [], 18);
}

function doCheckIn(p, verified) {
  const res = applyCheckin(game, p, verified);
  game = res.state;
  store.set("reach.game", game);
  refreshExplored();
  endNav();
  clearSelection();
  renderHud();
  renderCards();
  celebrate("+" + (res.gained + res.bonus) + " XP",
    res.isNew ? `${p.name} kəşf edildi!` + (verified ? " (GPS ilə təsdiqləndi)" : "") : `${p.name} · təkrar ziyarət`,
    CAT_EMOJI[p.cat]);
  let delay = 900;
  const later = (text) => { setTimeout(() => toast(text, 3200), delay); delay += 1100; };
  for (const q of res.newQuests) later(`✅ ${q.text} (+${QUEST_XP} XP)`);
  for (const id of res.newBadges) { const b = BADGES.find((x) => x.id === id); later(`🏅 Yeni nişan: ${b.name}`); }
  if (res.levelAfter > res.levelBefore) later(`⬆️ Səviyyə ${res.levelAfter}: ${levelFor(game.xp).name}`);
}

// ---------- running a search ----------
function setStartMarker(lat, lon) {
  if (startMarker) startMarker.remove();
  startMarker = new maplibregl.Marker({ element: el("div", "sdot") }).setLngLat([lon, lat]).addTo(map);
}

async function run(lat, lon) {
  if (busy || navPlace) return;
  busy = true; start = [lat, lon];
  setStartMarker(lat, lon);
  clearSelection();
  const limit = minutes * 60 * WALK_MS;
  try {
    info("Yüklənir…");
    const t0 = performance.now();
    const radius = Math.round(limit + 80);
    const local = !!(LOCAL && lat >= LOCAL.bbox[0] && lat <= LOCAL.bbox[2] && lon >= LOCAL.bbox[1] && lon <= LOCAL.bbox[3]);
    const fromCache = !local && !!(cache && cache.lat === lat && cache.lon === lon && cache.radius >= radius);
    let g, poiEls;
    if (local) {
      g = LOCAL.g; poiEls = LOCAL.pois;
    } else {
      if (!fromCache) {
        const [els0, poi0] = await Promise.all([fetchWays(lat, lon, radius), fetchPois(lat, lon, radius).catch(() => null)]);
        cache = poi0 ? { lat, lon, radius, els: els0, poiEls: poi0 } : null;
        data = { els: els0, poiEls: poi0 };
      } else data = cache;
      poiEls = data.poiEls;
      g = buildGraph(data.els);
    }
    const s = nearestNode(g, lat, lon);
    if (s.node < 0) throw new Error("Burada küçə tapılmadı");
    const dist = dijkstra(g, s.node, limit);
    const { segs, total } = reachableSegments(g, dist, limit);
    ctx = { g, dist };
    rawRanked = poiEls ? rankPois(poiEls, g, dist, limit) : [];
    renderCards();
    showLines(segs);
    info(`${minutes} dəq · ${(total / 1000).toFixed(1)} km küçə · ${rawRanked.length} yer · ${local ? "yerli data" : "şəbəkə"} ${Math.round(performance.now() - t0)} ms`);
  } catch (e) {
    info("");
    toast("Xəta: " + e.message);
  } finally { busy = false; }
}

map.on("click", (e) => run(e.lngLat.lat, e.lngLat.lng));

// ---------- controls ----------
document.querySelectorAll("#times .pill").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("#times .pill").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    minutes = +b.dataset.min;
    if (start) run(start[0], start[1]);
  };
});

function renderCats() {
  const row = $("cats");
  row.replaceChildren();
  const opts = [["all", "🌍 Hamısı"], ...Object.keys(CAT_LABELS).map((c) => [c, CAT_EMOJI[c] + " " + CAT_LABELS[c]])];
  for (const [id, label] of opts) {
    const b = el("button", "pill" + (id === cat ? " on" : ""), label);
    b.onclick = () => { cat = id; clearSelection(); renderCats(); renderCards(); };
    row.appendChild(b);
  }
}

$("surprise").onclick = () => {
  if (!start) { toast("Əvvəl harada olduğunu göstər: xəritəyə toxun və ya 📍 bas"); return; }
  const pool = cat === "all" ? rawRanked : rawRanked.filter((p) => p.cat === cat);
  const p = pickSurprise(pool, visitedSet());
  if (!p) { toast("Bu zonada yer tapılmadı. Vaxtı artır."); return; }
  toast(`${CAT_EMOJI[p.cat]} Bu gün: ${p.name}`);
  selectPlace(p);
};

function locate() {
  if (!navigator.geolocation) { toast("Brauzer lokasiyanı dəstəkləmir. Xəritəyə toxun."); return; }
  navigator.geolocation.getCurrentPosition(
    (p) => { map.jumpTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 16 }); run(p.coords.latitude, p.coords.longitude); },
    () => toast("Lokasiya icazəsi yoxdur (HTTPS lazımdır). Xəritəyə toxun."),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
$("locBtn").onclick = locate;

// ---------- saved start points ----------
function renderSaved() {
  const row = $("saved"), saved = getSaved();
  row.replaceChildren();
  row.hidden = !saved.length;
  for (const s of saved) {
    const b = el("button", "pill", "📍 " + s.name);
    b.onclick = () => { map.jumpTo({ center: [s.lon, s.lat], zoom: 16 }); run(s.lat, s.lon); };
    row.appendChild(b);
  }
}

// ---------- profile ----------
function renderProfile() {
  const box = $("profile");
  box.replaceChildren();
  const today = dayStr(new Date()), st = statsOf(game.checkins, today), lv = levelFor(game.xp);
  const wrap = el("div", "wrap");
  const top = el("div", "top");
  const close = el("button", "close", "✕");
  close.setAttribute("aria-label", "Bağla");
  close.onclick = () => box.classList.remove("open");
  top.append(el("h1", null, "Mənim kəşflərim"), close);

  const hero = el("div", "hero"), tx = el("div", "tx");
  const bar = el("div", "pbar"); bar.appendChild(el("i")); bar.firstChild.style.width = Math.round(lv.pct * 100) + "%";
  tx.append(el("div", "nm", lv.name), el("div", "sub", `${lv.into} / ${lv.need} XP · cəmi ${game.xp} XP · 🔥 ${st.streak} gün ardıcıl`), bar);
  hero.append(el("div", "big", String(lv.level)), tx);
  wrap.append(top, hero);

  wrap.appendChild(el("h2", null, "Bugünkü tapşırıqlar"));
  const todays = game.checkins.filter((c) => c.day === today && c.nw), doneIds = (game.questsDone || {})[today] || [];
  for (const q of questsFor(today)) {
    const prog = Math.min(q.n, questProgress(q, todays)), done = doneIds.includes(q.id);
    const row = el("div", "qrow" + (done ? " done" : ""));
    row.append(el("span", "qe", done ? "✅" : q.emoji), el("span", "qt", q.text), el("span", "qp", `${prog}/${q.n} · +${QUEST_XP}`));
    wrap.appendChild(row);
  }

  wrap.appendChild(el("h2", null, "Nişanlar"));
  const grid = el("div", "badges");
  for (const b of BADGES) {
    const on = (game.badges || []).includes(b.id);
    const d = el("div", "bdg" + (on ? "" : " off"));
    d.append(el("div", "be", b.emoji), el("div", "bn", b.name), el("div", "bd", b.desc));
    grid.appendChild(d);
  }
  wrap.appendChild(grid);

  const totalAll = Object.values(TOTALS).reduce((a, b) => a + b, 0);
  wrap.appendChild(el("h2", null, totalAll ? `Mərkəzi Baku: ${(100 * st.total / totalAll).toFixed(1)}% kəşf edilib` : "Kəşf irəliləyişi"));
  for (const c of Object.keys(CAT_LABELS)) {
    const have = st.byCat[c] || 0, all = TOTALS[c] || 0;
    const row = el("div", "crow"), pb = el("div", "pbar g");
    pb.appendChild(el("i")); pb.firstChild.style.width = (all ? Math.min(100, 100 * have / all) : 0) + "%";
    row.append(el("span", "ce2", CAT_EMOJI[c]), el("span", "cl", CAT_LABELS[c]), el("span", "cc", all ? `${have} / ${all}` : String(have)), pb);
    wrap.appendChild(row);
  }

  wrap.appendChild(el("h2", null, "Yerlərim"));
  getSaved().forEach((s, i) => {
    const row = el("div", "srow"), del = el("button", null, "🗑");
    del.setAttribute("aria-label", "Sil");
    del.onclick = () => { store.set("reach.saved", getSaved().filter((_, j) => j !== i)); renderSaved(); renderProfile(); };
    row.append(el("span", null, "📍"), el("span", "sn", s.name), del);
    wrap.appendChild(row);
  });
  const add = el("button", "btn2", "＋ Hazırkı nöqtəni saxla");
  add.onclick = () => {
    if (!start) { toast("Əvvəl xəritəyə toxun, sonra həmin nöqtəni saxla."); return; }
    const name = (prompt("Bu nöqtənin adı (məs. Ev, Universitet):") || "").trim().slice(0, 20);
    if (!name) return;
    store.set("reach.saved", getSaved().filter((x) => x.name !== name).concat([{ name, lat: start[0], lon: start[1] }]));
    renderSaved(); renderProfile();
  };
  wrap.appendChild(add);

  const reset = el("button", "reset", "Bütün irəliləyişi sıfırla");
  reset.onclick = () => {
    if (!confirm("Bütün XP, nişanlar və kəşflər silinsin?")) return;
    game = emptyGame(); store.set("reach.game", game);
    refreshExplored(); renderHud(); renderCards(); renderProfile();
  };
  wrap.appendChild(reset);
  box.appendChild(wrap);
}

$("hud").onclick = () => { renderProfile(); $("profile").classList.add("open"); };

// ---------- startup ----------
// Preprocessed Baku data (from prepare_baku.py). If baku.json is missing, taps fall back to Overpass.
fetch("baku.json")
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((d) => {
    LOCAL = { bbox: d.bbox, g: graphFromData(d), pois: d.pois };
    TOTALS = totalsFromPois(d.pois);
    info(`Baku datası yükləndi: ${d.pois.length} yer`);
  })
  .catch(() => {})
  .then(() => {
    // Returning user who already allowed location: start from where they are, no tap needed.
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: "geolocation" }).then((r) => { if (r.state === "granted") locate(); }).catch(() => {});
    }
  });

renderHud();
renderCats();
renderSaved();
renderCards();
</script>
